name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package and plugin versions
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for file in \
            packages/storybook-addon-review/package.json \
            plugins/storybook-review/plugin.json \
            plugins/storybook-review/.claude-plugin/plugin.json
          do
            ACTUAL="$(node -p "require('./$file').version")"
            if [ "$ACTUAL" != "$TAG_VERSION" ]; then
              echo "Version mismatch in $file: expected $TAG_VERSION, got $ACTUAL"
              exit 1
            fi
          done

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test

      - name: Publish to npm
        working-directory: packages/storybook-addon-review
        run: npm publish --provenance --access public
