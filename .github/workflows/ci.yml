name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      # The checks addons.mozilla.org runs before signing the Firefox add-on.
      - run: bunx web-ext@10.8.0 lint --source-dir packages/storybook-review-extension/dist/firefox --warnings-as-errors
